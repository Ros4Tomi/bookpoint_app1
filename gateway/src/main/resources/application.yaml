server:
  port: 8080 

spring:
  application:
    name: ms-gateway
  cloud:
    gateway:
      mvc:  # <-- ¡AQUÍ ESTÁ LA MAGIA! Esto activa las rutas para tu dependencia WebMVC
        routes:
          # === 1. USUARIOS ===
          - id: ms-usuarios
            uri: http://localhost:8081
            predicates:
              - Path=/api/usuarios/**
          - id: ms-usuarios-docs
            uri: http://localhost:8081
            predicates:
              - Path=/docs/ms-usuarios/**, /docs/ms-usuarios
            filters:
              - RewritePath=/docs/ms-usuarios(?<segment>.*), /v3/api-docs$\{segment}

          # === 2. CATALOGO ===
          - id: ms-catalogo
            uri: http://localhost:8082
            predicates:
              - Path=/api/libros/**
          - id: ms-catalogo-docs
            uri: http://localhost:8082
            predicates:
              - Path=/docs/ms-catalogo/**, /docs/ms-catalogo
            filters:
              - RewritePath=/docs/ms-catalogo(?<segment>.*), /v3/api-docs$\{segment}

          # === 3. FACTURACION ===
