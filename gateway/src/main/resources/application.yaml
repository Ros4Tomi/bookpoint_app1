# Configuración de consolidación de interfaces
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: "1. Microservicio Usuarios"
        url: /docs/ms-usuarios
      - name: "2. Microservicio Catalogo"
